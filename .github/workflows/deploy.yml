name: Build & Deploy Healthcare Chatbot

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Give GITHUB_TOKEN the permissions needed to publish packages
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: 🔨 Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🔨 Build with Maven
        run: mvn clean package -DskipTests -B

      - name: ✅ Verify WAR was created
        run: ls -la target/*.war

      - name: 📦 Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: healthcare-chatbot-war
          path: target/healthcare-chatbot.war
          retention-days: 30

  docker:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/healthcare-chatbot
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 🏗️ Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
